<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <style>
        .book-image-container {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: zoom-in;
            max-width: 400px;
            margin: 0 auto;
            background: linear-gradient(135deg, #f8f5f2 0%, #ffffff 100%);
            padding: 20px;
        }
        
        .book-image-container img {
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(68, 46, 24, 0.12);
        }
        
        .book-image-container:hover img {
            transform: scale(1.03);
            box-shadow: 0 12px 32px rgba(68, 46, 24, 0.18);
        }
        
        .book-image-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 15px;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(111, 78, 55, 0.08);
        }
        
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        
        .spec-item:last-child {
            border-bottom: none;
        }
        
        .spec-label {
            font-weight: 600;
            color: var(--text);
        }
        
        .spec-value {
            color: #666;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
        }
        
        .feature-item i {
            color: var(--accent);
            font-size: 1.2rem;
        }
        
        .related-book-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .related-book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .review-card {
            border-left: 4px solid var(--accent);
            background: #fafafa;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 15px;
        }
        
        .review-stars {
            color: #ffc107;
        }
        
        .zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: zoom-out;
            backdrop-filter: blur(8px);
        }
        
        .zoom-overlay.active {
            display: flex;
        }

        .thumb-gallery {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }

        .thumb-button {
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 4px;
            background: #fff;
            box-shadow: 0 4px 12px rgba(68, 46, 24, 0.08);
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .thumb-button:hover,
        .thumb-button.active {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .thumb-button img {
            width: 58px;
            height: 78px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }
        
        .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .original-price {
            text-decoration: line-through;
            color: #999;
        }
        
        .rating i {
            color: #ffc107;
        }
        
        .thumbnail-gallery {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        
        .thumbnail {
            width: 70px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            opacity: 0.7;
        }
        
        .thumbnail:hover, .thumbnail.active {
            border-color: var(--primary);
            transform: scale(1.05);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-4">
        <div class="row mb-3">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/books}">Books</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${book.title}"></li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row align-items-start" data-aos="fade-up">
            <div class="col-12">
                <div class="row g-4">
                    <div class="col-lg-4 col-md-5 mb-4">
                        <div class="book-image-container shadow">
                            <img th:src="${book.imageUrl}" th:alt="${book.title + ' book cover'}"
                                 onerror="this.onerror=null;this.src='/images/books/_cover-unavailable.svg';">
                        </div>
                    </div>

                    <div class="col-lg-8 col-md-7">
                <div class="mb-2">
                    <a th:href="@{/books}" class="btn btn-link text-decoration-none ps-0">
                        <i class="fas fa-arrow-left me-2"></i>Back to Books
                    </a>
                </div>
                
                <h1 class="fw-bold mb-2" style="font-family: 'Playfair Display', serif;" th:text="${book.title}"></h1>
                <p class="mb-2" style="color: var(--primary); font-size: 1.1rem;" th:text="'By ' + ${book.author.name}"></p>
                
                <div class="d-flex align-items-center mb-3">
                    <div class="rating me-3">
                        <i class="fas fa-star" th:if="${book.rating >= 1}"></i>
                        <i class="far fa-star" th:if="${book.rating < 1}"></i>
                        <i class="fas fa-star" th:if="${book.rating >= 2}"></i>
                        <i class="far fa-star" th:if="${book.rating < 2}"></i>
                        <i class="fas fa-star" th:if="${book.rating >= 3}"></i>
                        <i class="far fa-star" th:if="${book.rating < 3}"></i>
                        <i class="fas fa-star" th:if="${book.rating >= 4}"></i>
                        <i class="far fa-star" th:if="${book.rating < 4}"></i>
                        <i class="fas fa-star" th:if="${book.rating >= 5}"></i>
                        <i class="far fa-star" th:if="${book.rating < 5}"></i>
                        <span class="ms-1" th:text="${book.rating}"></span>
                    </div>
                    <span class="text-muted" th:text="'(' + ${book.ratingCount} + ' reviews)'"></span>
                </div>

                <div class="mb-3">
                    <span class="price" th:text="'₹' + ${book.formattedDiscountedPrice}"></span>
                    <span class="original-price ms-2" th:if="${book.discount > 0}"
                          th:text="'₹' + ${book.formattedPrice}"></span>
                    <span class="badge bg-success ms-2" th:if="${book.discount > 0}" 
                          th:text="'Save ' + ${book.discount} + '%'"></span>
                </div>

                <div class="mb-3">
                    <span class="badge" 
                          th:class="${book.isInStock()} ? 'bg-success' : 'bg-danger'"
                          th:text="${book.isInStock()} ? 'In Stock' : 'Out of Stock'"></span>
                </div>

                <div class="mb-4">
                    <h5 class="fw-bold mb-2">Description</h5>
                    <p class="text-muted" th:text="${book.description}"></p>
                </div>

                <div class="d-flex flex-wrap gap-2 mb-4">
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn btn-primary" 
                                th:disabled="${!book.isInStock()}">
                            <i class="fas fa-shopping-cart me-2"></i>
                            <span th:text="${book.isInStock()} ? 'Add to Cart' : 'Out of Stock'"></span>
                        </button>
                    </form>
                    <form th:action="@{/cart/buy-now}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn btn-outline-primary" 
                                th:disabled="${!book.isInStock()}">
                            <i class="fas fa-bolt me-2"></i>Buy Now
                        </button>
                    </form>
                    <form th:action="@{/wishlist/add}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="far fa-heart me-2"></i>
                            <span th:text="${inWishlist} ? 'In Wishlist' : 'Add to Wishlist'"></span>
                        </button>
                    </form>
                    <button class="btn btn-outline-secondary" onclick="shareBook()">
                        <i class="fas fa-share-alt me-2"></i>Share
                    </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabbed Content -->
        <div class="row mt-5" data-aos="fade-up">
            <div class="col-lg-12">
                <ul class="nav nav-tabs mb-4" id="bookTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="specifications-tab" data-bs-toggle="tab" data-bs-target="#specifications" type="button" role="tab">Specifications</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews" type="button" role="tab">Reviews</button>
                    </li>
                </ul>
                
                <div class="tab-content" id="bookTabsContent">
                    <!-- Specifications Tab -->
                    <div class="tab-pane fade show active" id="specifications" role="tabpanel">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="spec-item">
                                            <span class="spec-label">ISBN</span>
                                            <span class="spec-value" th:text="${book.isbn != null and !#strings.isEmpty(book.isbn) ? book.isbn : 'Not available'}"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Publisher</span>
                                            <span class="spec-value" th:text="${book.publisher}"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Language</span>
                                            <span class="spec-value" th:text="${book.language}"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Pages</span>
                                            <span class="spec-value" th:text="${book.pages}"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Publication Date</span>
                                            <span class="spec-value" th:text="${book.publishedDate != null ? #temporals.format(book.publishedDate, 'MMM dd, yyyy') : 'N/A'}"></span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="spec-item">
                                            <span class="spec-label">Category</span>
                                            <span class="spec-value" th:text="${book.category.name}"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Author</span>
                                            <span class="spec-value" th:text="${book.author.name}"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Stock</span>
                                            <span class="spec-value" th:text="${book.stock} + ' available'"></span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Sold</span>
                                            <span class="spec-value" th:text="${book.soldCount} + ' copies'"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Reviews Tab -->
                    <div class="tab-pane fade" id="reviews" role="tabpanel">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="row mb-4">
                                    <div class="col-md-4 text-center">
                                        <h2 class="fw-bold" th:text="${book.rating}"></h2>
                                        <div class="rating mb-2">
                                            <i class="fas fa-star" th:if="${book.rating >= 1}"></i>
                                            <i class="far fa-star" th:if="${book.rating < 1}"></i>
                                            <i class="fas fa-star" th:if="${book.rating >= 2}"></i>
                                            <i class="far fa-star" th:if="${book.rating < 2}"></i>
                                            <i class="fas fa-star" th:if="${book.rating >= 3}"></i>
                                            <i class="far fa-star" th:if="${book.rating < 3}"></i>
                                            <i class="fas fa-star" th:if="${book.rating >= 4}"></i>
                                            <i class="far fa-star" th:if="${book.rating < 4}"></i>
                                            <i class="fas fa-star" th:if="${book.rating >= 5}"></i>
                                            <i class="far fa-star" th:if="${book.rating < 5}"></i>
                                        </div>
                                        <p class="text-muted" th:text="'Based on ' + ${book.ratingCount} + ' reviews'"></p>
                                    </div>
                                    <div class="col-md-8">
                                        <div class="progress mb-2" style="height: 10px;">
                                            <div class="progress-bar bg-warning" style="width: 70%"></div>
                                        </div>
                                        <div class="progress mb-2" style="height: 10px;">
                                            <div class="progress-bar bg-warning" style="width: 20%"></div>
                                        </div>
                                        <div class="progress mb-2" style="height: 10px;">
                                            <div class="progress-bar bg-warning" style="width: 7%"></div>
                                        </div>
                                        <div class="progress mb-2" style="height: 10px;">
                                            <div class="progress-bar bg-warning" style="width: 2%"></div>
                                        </div>
                                        <div class="progress mb-2" style="height: 10px;">
                                            <div class="progress-bar bg-warning" style="width: 1%"></div>
                                        </div>
                                    </div>
                                </div>

                                <div th:if="${reviews != null and !reviews.isEmpty()}">
                                    <div th:each="review : ${reviews}" class="review-card">
                                        <div class="d-flex align-items-start mb-3">
                                            <div class="user-avatar me-3">
                                                <img th:src="@{https://ui-avatars.com/api/(name=${review.user.firstName + ' ' + review.user.lastName}, background='6F4E37', color='fff')}"
                                                     class="rounded-circle" width="50" height="50" alt="User Avatar">
                                            </div>
                                            <div class="flex-grow-1">
                                                <div class="d-flex justify-content-between align-items-start">
                                                    <h6 class="fw-bold mb-0" th:text="${review.user.firstName + ' ' + review.user.lastName}"></h6>
                                                    <div class="review-stars">
                                                        <i class="fas fa-star" th:if="${review.rating >= 1}"></i>
                                                        <i class="far fa-star" th:if="${review.rating < 1}"></i>
                                                        <i class="fas fa-star" th:if="${review.rating >= 2}"></i>
                                                        <i class="far fa-star" th:if="${review.rating < 2}"></i>
                                                        <i class="fas fa-star" th:if="${review.rating >= 3}"></i>
                                                        <i class="far fa-star" th:if="${review.rating < 3}"></i>
                                                        <i class="fas fa-star" th:if="${review.rating >= 4}"></i>
                                                        <i class="far fa-star" th:if="${review.rating < 4}"></i>
                                                        <i class="fas fa-star" th:if="${review.rating >= 5}"></i>
                                                        <i class="far fa-star" th:if="${review.rating < 5}"></i>
                                                    </div>
                                                </div>
                                                <p class="text-muted mb-0" th:text="${review.comment}"></p>
                                                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}"></small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${reviews == null or reviews.isEmpty()}">
                                    <p class="text-muted">No reviews yet. Be the first to review this book!</p>
                                </div>

                                <div th:if="${currentUser}">
                                    <h5 class="fw-bold mb-3 mt-4">Write a Review</h5>
                                    <form th:action="@{/review/add}" method="post">
                                        <input type="hidden" name="bookId" th:value="${book.id}">
                                        <input type="hidden" name="rating" id="ratingInput" value="5">
                                        <div class="mb-3">
                                            <label class="form-label">Your Rating</label>
                                            <div class="rating-input" id="starRating">
                                                <i class="far fa-star fa-2x star" data-rating="1"></i>
                                                <i class="far fa-star fa-2x star" data-rating="2"></i>
                                                <i class="far fa-star fa-2x star" data-rating="3"></i>
                                                <i class="far fa-star fa-2x star" data-rating="4"></i>
                                                <i class="far fa-star fa-2x star" data-rating="5"></i>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Your Review</label>
                                            <textarea class="form-control" name="comment" rows="4" placeholder="Share your thoughts about this book..."></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary">Submit Review</button>
                                    </form>
                                </div>
                                <div th:unless="${currentUser}">
                                    <p class="text-muted mt-4">Please <a th:href="@{/login}">login</a> to write a review.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Books -->
        <div class="row mt-5" data-aos="fade-up">
            <div class="col-lg-12">
                <h3 class="section-title mb-4">Related Books</h3>
                <div class="row">
                    <div th:each="relatedBook : ${relatedBooks}" class="col-md-2 col-sm-4 col-6 mb-4">
                        <div class="card related-book-card border-0">
                            <a th:href="@{/book/{id}(id=${relatedBook.id})}">
                                <img th:src="${relatedBook.imageUrl}" class="card-img-top" th:alt="${relatedBook.title + ' book cover'}"
                                     onerror="this.onerror=null;this.src='/images/books/_cover-unavailable.svg';" style="height: 200px; object-fit: cover;">
                            </a>
                            <div class="card-body p-3">
                                <h6 class="card-title text-truncate mb-1" th:text="${relatedBook.title}"></h6>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="rating small">
                                        <i class="fas fa-star"></i>
                                        <span th:text="${relatedBook.rating}"></span>
                                    </div>
                                    <p class="price mb-0 small" th:text="'₹' + ${relatedBook.formattedDiscountedPrice}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        AOS.init({ duration: 800, easing: 'ease-in-out', once: true });
        
        // Share functionality
        function shareBook() {
            const url = window.location.href;
            const title = document.querySelector('h1').textContent;
            
            if (navigator.share) {
                navigator.share({
                    title: title,
                    url: url
                }).catch(console.error);
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(url).then(() => {
                    alert('Link copied to clipboard!');
                }).catch(console.error);
            }
        }
        
        // Star rating interaction
        const starRating = document.getElementById('starRating');
        const ratingInput = document.getElementById('ratingInput');
        
        if (starRating) {
            const stars = starRating.querySelectorAll('.star');
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = this.getAttribute('data-rating');
                    ratingInput.value = rating;
                    
                    stars.forEach((s, index) => {
                        if (index < rating) {
                            s.classList.remove('far');
                            s.classList.add('fas');
                        } else {
                            s.classList.remove('fas');
                            s.classList.add('far');
                        }
                    });
                });
                
                star.addEventListener('mouseenter', function() {
                    const rating = this.getAttribute('data-rating');
                    stars.forEach((s, index) => {
                        if (index < rating) {
                            s.classList.remove('far');
                            s.classList.add('fas');
                        } else {
                            s.classList.remove('fas');
                            s.classList.add('far');
                        }
                    });
                });
            });
            
            starRating.addEventListener('mouseleave', function() {
                const currentRating = ratingInput.value;
                stars.forEach((s, index) => {
                    if (index < currentRating) {
                        s.classList.remove('far');
                        s.classList.add('fas');
                    } else {
                        s.classList.remove('fas');
                        s.classList.add('far');
                    }
                });
            });
            
            // Initialize with 5 stars
            stars.forEach((s, index) => {
                if (index < 5) {
                    s.classList.remove('far');
                    s.classList.add('fas');
                }
            });
        }
        
        // GSAP animation for book details
        gsap.from('.book-image-container', {
            duration: 1,
            y: 50,
            opacity: 0,
            ease: 'power3.out'
        });
        
        gsap.from('.col-lg-7 h1, .col-lg-7 p, .col-lg-7 .rating', {
            duration: 1,
            x: 50,
            opacity: 0,
            stagger: 0.2,
            ease: 'power3.out',
            delay: 0.3
        });
        
        gsap.from('.btn', {
            duration: 0.8,
            scale: 0.8,
            opacity: 0,
            stagger: 0.1,
            ease: 'back.out(1.7)',
            delay: 0.6
        });
    </script>
</body>
</html>
