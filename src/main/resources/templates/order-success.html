<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8" data-aos="fade-up">
                <div class="card border-0 shadow text-center py-5">
                    <div class="card-body">
                        <div class="mb-4">
                            <i class="fas fa-check-circle fa-5x text-success"></i>
                        </div>
                        <h1 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif;">
                            Order Placed Successfully!
                        </h1>
                        <p class="lead text-muted mb-4">
                            Thank you for your purchase. Your order has been confirmed.
                        </p>

                        <div class="alert alert-info d-inline-block px-4 py-2">
                            <strong>Order Number:</strong> <span class="fw-bold" th:text="${order.orderNumber != null ? order.orderNumber : 'ORD-' + order.id}"></span>
                        </div>

                        <div class="row mt-5 text-start">
                            <div class="col-md-6 mb-3" th:if="${order.shippingAddress != null}">
                                <h5 class="fw-bold"><i class="fas fa-map-marker-alt me-2 text-primary"></i>Shipping Address</h5>
                                <p class="mb-1 text-dark" th:text="${order.shippingAddress.addressLine1}"></p>
                                <p class="mb-1 text-muted" th:if="${order.shippingAddress.addressLine2 != null and !order.shippingAddress.addressLine2.empty}" 
                                   th:text="${order.shippingAddress.addressLine2}"></p>
                                <p class="mb-1 text-muted" th:text="${order.shippingAddress.city} + ', ' + ${order.shippingAddress.state} + ' - ' + ${order.shippingAddress.postalCode}"></p>
                                <p class="mb-0 text-muted" th:text="${order.shippingAddress.country}"></p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <h5 class="fw-bold"><i class="fas fa-credit-card me-2 text-primary"></i>Payment & Status</h5>
                                <p class="mb-1"><strong>Method:</strong> <span th:text="${order.paymentMethod}"></span></p>
                                <p class="mb-2"><strong>Payment Status:</strong> <span class="badge bg-secondary" th:text="${order.paymentStatus}"></span></p>
                                <p class="mb-0"><strong>Order Status:</strong> 
                                    <span class="badge px-3 py-1 ms-1" 
                                          th:classappend="${order.status == 'DELIVERED' ? 'bg-success' : (order.status == 'CANCELLED' ? 'bg-danger' : (order.status == 'SHIPPED' ? 'bg-primary' : (order.status == 'PROCESSING' ? 'bg-info text-dark' : 'bg-warning text-dark')))}" 
                                          th:text="${order.status}"></span>
                                </p>
                            </div>
                        </div>

                        <div class="table-responsive mt-4">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Book</th>
                                        <th>Quantity</th>
                                        <th>Price</th>
                                        <th class="text-end">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.orderItems}">
                                        <td>
                                            <div class="d-flex align-items-center text-start">
                                                <img th:src="${item.book.imageUrl}" 
                                                     alt="Book" style="width: 45px; height: 60px; object-fit: cover;" 
                                                     class="rounded me-3">
                                                <div>
                                                    <h6 class="mb-0 fw-bold" th:text="${item.book.title}"></h6>
                                                    <small class="text-muted" th:text="${item.book.author.name}"></small>
                                                </div>
                                            </div>
                                        </td>
                                        <td th:text="${item.quantity}"></td>
                                        <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-end fw-bold" th:text="'₹' + ${#numbers.formatDecimal(item.totalPrice != null ? item.totalPrice : item.price * item.quantity, 0, 'COMMA', 0, 'POINT')}"></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr th:if="${order.shippingAmount != null and order.shippingAmount > 0}">
                                        <td colspan="3" class="text-end text-muted">Shipping Fee</td>
                                        <td class="text-end fw-bold" th:text="'₹' + ${#numbers.formatDecimal(order.shippingAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                                    </tr>
                                    <tr>
                                        <td colspan="3" class="text-end fw-bold fs-5">Grand Total</td>
                                        <td class="text-end fw-bold price fs-4" th:text="'₹' + ${#numbers.formatDecimal(order.finalAmount != null ? order.finalAmount : order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-5">
                            <a th:href="@{/books}" class="btn btn-outline-primary">
                                <i class="fas fa-book me-2"></i>Continue Shopping
                            </a>
                            <a th:href="@{/profile/orders}" class="btn btn-primary">
                                <i class="fas fa-list me-2"></i>View My Orders
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
