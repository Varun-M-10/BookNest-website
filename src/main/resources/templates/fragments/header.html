<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Premium Online Book Store</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon.png}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
    
    <style>
        :root {
            --primary: #6F4E37;
            --secondary: #F8F5F2;
            --accent: #C89B3C;
            --text: #222;
            --light: #fff;
            --dark: #333;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            background-color: var(--secondary);
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
        
        .navbar {
            background-color: var(--light);
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            padding: 1rem 0;
        }
        
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .navbar-brand:hover {
            color: var(--accent);
        }
        
        .nav-link {
            color: var(--text);
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }
        
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            border-radius: 25px;
            padding: 0.5rem 1.5rem;
        }
        
        .btn-primary:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        
        .btn-outline-primary {
            border-color: var(--primary);
            color: var(--primary);
            border-radius: 25px;
            padding: 0.5rem 1.5rem;
        }
        
        .btn-outline-primary:hover {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        .book-card-img {
            border-radius: 15px 15px 0 0;
            height: 350px;
            object-fit: cover;
        }
        
        .badge-discount {
            background-color: var(--accent);
            color: white;
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.2rem;
        }
        
        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 0.9rem;
        }
        
        .rating {
            color: #ffc107;
        }
        
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .section-subtitle {
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        footer {
            background-color: var(--primary);
            color: white;
            padding: 3rem 0;
        }
        
        footer a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
        }
        
        footer a:hover {
            color: white;
        }
        
        .social-icons a {
            font-size: 1.5rem;
            margin-right: 1rem;
            transition: color 0.3s;
        }
        
        .social-icons a:hover {
            color: var(--accent);
        }
        
        .cart-badge {
            background-color: var(--accent);
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8rem;
        }
        
        .search-form {
            position: relative;
        }
        
        .search-form input {
            border-radius: 25px 0 0 25px;
            border: 2px solid var(--primary);
        }
        
        .search-form button {
            border-radius: 0 25px 25px 0;
            background-color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .hero-section {
            background: linear-gradient(135deg, var(--secondary) 0%, #e8e4df 100%);
            padding: 5rem 0;
        }
        
        /* Homepage "Featured Categories" cards (home.html: a.category-card).
           Scoped to the <a> tag so it never reaches the Categories page's
           Bootstrap .card.category-card markup below, which has its own
           box model (Bootstrap already supplies its border-radius/shadow/
           background there; this padding/hover would otherwise double up). */
        a.category-card {
            text-align: center;
            padding: 2rem;
            border-radius: 15px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s;
            cursor: pointer;
        }

        a.category-card:hover {
            transform: translateY(-5px);
        }

        .category-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        /* Categories page grid (categories.html: .card.category-card).
           Keeps every card the same height in every row regardless of how
           long its name or description is. Bootstrap's own .h-100 + flex
           already equalizes cards within a single row, but without a
           shared floor, a row that happens to contain only short names/
           descriptions renders shorter overall than a row containing a
           two-line name like "Programming & Technology". Reserving a
           consistent minimum for the title (2 lines) and description (a
           few lines) removes that row-to-row difference. */
        .card.category-card .card-title {
            min-height: 3.7rem;
            overflow-wrap: break-word;
        }

        .card.category-card .card-text {
            min-height: 5.7rem;
        }
        
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: background-color 0.3s;
        }
        
        .back-to-top:hover {
            background-color: var(--accent);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" th:fragment="logo">
            <i class="fas fa-book-open me-2"></i>BookNest
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/books}">Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categories}">Categories</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}">Contact</a>
                </li>
            </ul>
            
            <form class="d-flex search-form me-3" th:action="@{/search}" method="get">
                <input class="form-control" type="search" name="keyword" placeholder="Search books..." required>
                <button class="btn" type="submit">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/wishlist}">
                        <i class="fas fa-heart"></i>
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/cart}">
                        <i class="fas fa-shopping-cart"></i>
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <a class="nav-link" th:href="@{/wishlist}">
                        <i class="fas fa-heart"></i>
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <a class="nav-link" th:href="@{/cart}">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-badge" th:text="${cartItemCount != null ? cartItemCount : 0}">0</span>
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/register}">
                        <i class="fas fa-user-plus"></i> Register
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> <span th:text="${currentUser.firstName}"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
                            <li><a class="dropdown-item" th:href="@{/profile/orders}">Orders</a></li>
                            <li><a class="dropdown-item" th:href="@{/profile/addresses}">Addresses</a></li>
                            <li><a class="dropdown-item" th:href="@{/profile/reviews}">Reviews</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
