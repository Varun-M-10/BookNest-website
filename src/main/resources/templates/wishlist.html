<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="text-center mb-5" data-aos="fade-up">
            <h1 class="section-title">My Wishlist</h1>
            <p class="text-muted">Books you've saved for later</p>
        </div>

        <div th:if="${wishlist == null or wishlist.empty}">
            <div class="text-center py-5" data-aos="fade-up">
                <i class="fas fa-heart fa-4x text-muted mb-3"></i>
                <h4>Your wishlist is empty</h4>
                <p class="text-muted">Save your favorite books here</p>
                <a th:href="@{/books}" class="btn btn-primary">
                    <i class="fas fa-book me-2"></i>Browse Books
                </a>
            </div>
        </div>

        <div class="row g-4" th:if="${wishlist != null and !wishlist.empty}">
            <div class="col-lg-3 col-md-6 col-12" th:each="item : ${wishlist}" data-aos="fade-up">
                <div class="card h-100">
                    <div class="position-relative">
                        <img th:src="${item.book.imageUrl}" class="card-img-top book-card-img" th:alt="${item.book.title + ' book cover'}"
                             onerror="this.onerror=null;this.src='/images/books/_cover-unavailable.svg'">
                        <div class="position-absolute top-0 end-0 p-3">
                            <form th:action="@{/wishlist/remove}" method="post">
                                <input type="hidden" name="bookId" th:value="${item.book.id}">
                                <button type="submit" class="btn btn-danger rounded-circle btn-sm">
                                    <i class="fas fa-times"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="card-body">
                        <h6 class="card-title text-truncate" th:text="${item.book.title}"></h6>
                        <p class="card-text text-muted small mb-2" th:text="${item.book.author.name}"></p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="price" th:text="'₹' + ${item.book.formattedDiscountedPrice}"></span>
                                <span class="original-price ms-2" th:if="${item.book.discount > 0}"
                                      th:text="'₹' + ${item.book.formattedPrice}"></span>
                            </div>
                            <div class="rating">
                                <i class="fas fa-star"></i>
                                <span th:text="${item.book.rating}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0">
                        <a th:href="@{/book/{id}(id=${item.book.id})}" class="btn btn-primary w-100">
                            View Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
