<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Replaces Spring Boot's Whitelabel page; details stay in the server log. -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card border-0 shadow text-center py-5">
                    <div class="card-body">
                        <div class="mb-4">
                            <i class="fas fa-book-open fa-4x text-muted"></i>
                        </div>
                        <h1 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif;"
                            th:text="${status == 404} ? 'Page Not Found' : 'Something Went Wrong'">Something Went Wrong</h1>
                        <p class="text-muted mb-4"
                           th:text="${status == 404} ? 'The page you are looking for does not exist.' : 'We could not complete your request right now. Please try again.'">
                            We could not complete your request right now. Please try again.
                        </p>
                        <div class="d-flex flex-wrap justify-content-center gap-3">
                            <a th:href="@{/}" class="btn btn-outline-primary">
                                <i class="fas fa-home me-2"></i>Home
                            </a>
                            <a th:href="@{/books}" class="btn btn-primary">
                                <i class="fas fa-book me-2"></i>Browse Books
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
