<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Shopping Cart</li>
                    </ol>
                </div>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${cart == null or cart.cartItems.empty}">
            <div class="text-center py-5" data-aos="fade-up">
                <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
                <h4>Your cart is empty</h4>
                <p class="text-muted">Add some books to get started</p>
                <a th:href="@{/books}" class="btn btn-primary">
                    <i class="fas fa-book me-2"></i>Browse Books
                </a>
            </div>
        </div>

        <div class="row" data-aos="fade-up" th:if="${cart != null and !cart.cartItems.empty}">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="section-title mb-4">Shopping Cart</h3>

                        <div>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Price</th>
                                            <th>Quantity</th>
                                            <th>Total</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="item : ${cart.cartItems}">
                                            <td>
                                                <div class="d-flex align-items-center">
                                                    <img th:src="${item.book.imageUrl}" 
                                                         alt="Book" style="width: 80px; height: 100px; object-fit: cover;" 
                                                         class="rounded me-3">
                                                    <div>
                                                        <h6 class="mb-1" th:text="${item.book.title}"></h6>
                                                        <p class="text-muted small mb-0" th:text="${item.book.author.name}"></p>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>
                                                <span th:text="'₹' + ${item.price}"></span>
                                            </td>
                                            <td>
                                                <div class="input-group" style="width: 120px;">
                                                    <form th:action="@{/cart/update}" method="post" class="d-flex">
                                                        <input type="hidden" name="bookId" th:value="${item.book.id}">
                                                        <input type="number" name="quantity" class="form-control" 
                                                               th:value="${item.quantity}" min="1" 
                                                               th:max="${item.book.stock}">
                                                        <button type="submit" class="btn btn-outline-secondary">
                                                            <i class="fas fa-sync-alt"></i>
                                                        </button>
                                                    </form>
                                                </div>
                                            </td>
                                            <td>
                                                <span class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                                            </td>
                                            <td>
                                                <form th:action="@{/cart/remove}" method="post">
                                                    <input type="hidden" name="bookId" th:value="${item.book.id}">
                                                    <button type="submit" class="btn btn-link text-danger">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mt-4">
                                <a th:href="@{/books}" class="btn btn-outline-primary">
                                    <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                                </a>
                                <form th:action="@{/cart/clear}" method="post">
                                    <button type="submit" class="btn btn-outline-danger w-100">
                                        <i class="fas fa-trash me-2"></i>Clear Cart
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-4" style="font-family: 'Playfair Display', serif;">
                            Order Summary
                        </h4>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal</span>
                            <span th:text="'₹' + ${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Shipping</span>
                            <span class="text-success">FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold">Total</span>
                            <span class="fw-bold price" th:text="'₹' + ${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>

                        <a th:href="@{/checkout}" class="btn btn-primary w-100 btn-lg">
                            <i class="fas fa-lock me-2"></i>Proceed to Checkout
                        </a>

                        <div class="mt-3 text-center">
                            <small class="text-muted">
                                <i class="fas fa-shield-alt me-1"></i>Secure checkout powered by SSL
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>
</html>
